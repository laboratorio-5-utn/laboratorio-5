<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis reportes | Help Desk TI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="./css/styles.css"></head>
<body><div class="shell"><header class="topbar"><a class="brand" href="./usuario.html"><span class="brand-mark">+</span> Help Desk TI</a><div class="top-actions"><span class="user-chip" id="user-name"></span><button class="btn btn-outline btn-small" id="logout">Salir</button></div></header>
<main class="page"><div class="page-head"><div><div class="eyebrow">Portal de usuario</div><h1>Mis incidencias</h1><p>Reporta una avería y consulta su atención.</p></div></div><div id="global-alert" aria-live="polite"></div>
<div class="layout"><section class="panel"><div class="panel-title"><h2>Crear reporte</h2></div><form id="report-form"><div class="field"><label for="titulo">Título</label><input id="titulo" name="titulo" maxlength="120" required placeholder="Ej. Equipo no enciende"></div><div class="field"><label for="descripcion">Descripción del problema</label><textarea id="descripcion" name="descripcion" maxlength="3000" required placeholder="Describe qué ocurrió y cuándo..."></textarea></div><div class="field"><label for="tipo">Tipo de incidencia</label><select id="tipo" name="tipo" required><option value="hardware">Hardware</option><option value="software">Software</option></select></div><div class="field"><label for="departamento">Departamento afectado</label><select id="departamento" name="departamento" required><option>TI</option><option>Ventas</option><option>Contabilidad</option><option>Recursos Humanos</option><option>Operaciones</option></select></div><div class="field"><label for="imagenReporte">Foto del daño o error</label><input id="imagenReporte" name="imagenReporte" type="file" accept="image/*" required><span class="hint">Imagen obligatoria, máximo 5 MB.</span></div><button class="btn btn-primary" type="submit">Enviar reporte</button></form></section>
<section><div class="panel-title"><h2>Actividad reciente</h2></div><div id="tickets" class="ticket-list"><div class="empty-state">Cargando tus reportes...</div></div></section></div></main></div><script type="module" src="./js/usuario.js"></script></body></html>
